<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена — Job Person</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/img/favicon.png" sizes="64x64" type="image/png">
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .notfound {
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 40px 20px;
    }
    .notfound img { width: 219px; margin: 0 auto 28px; }
    .notfound h1 { font-size: clamp(1.6rem, 1rem + 2.4vw, 2.5rem); }
    .notfound p { margin-top: 14px; color: var(--c-muted); }
    .notfound .btn { margin-top: 28px; }
  </style>
</head>
<body>
  <main class="notfound">
    <div>
      <img src="assets/img/logo.png" width="219" height="43" alt="Job Person">
      <h1>Такой страницы нет</h1>
      <p>Возможно, ссылка устарела. Вернитесь на главную — там услуги, цены и контакты.</p>
      <a class="btn btn--primary" href="./">На главную</a>
    </div>
  </main>
</body>
</html>
